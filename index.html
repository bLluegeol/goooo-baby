<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RN Review Toolkit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFFFFF" id="themeColor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RN Review">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="NCLEX-RN and Middle East nurse licensing reviewer with progress monitor, body models, quizzes and attempt log.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app shell — sticky top bar, mode switch (Exam / Study) like DiGe-FN's Field / Study,
   left tab rail on wide screens, bottom tab bar on phones. Soft lavender palette. */
:root{
  --bg:#F6F3FA; --surface:#FFFFFF; --surface2:#EEE8F6; --line:#DDD4EA; --line-soft:#E9E3F2;
  --fg:#2B2340; --muted:#6C6283; --faint:#9A90AE;
  --accent:#7A5CC0; --accent-strong:#5E43A3; --accent-soft:#E7DEF7; --accent-ink:#FFFFFF; --lilac:#B9A4E6;
  --ok:#2F8F6A; --ok-soft:#DDF1E8; --warn:#B7791F; --warn-soft:#F7ECD9; --bad:#BE4A66; --bad-soft:#F7DFE5;
  --skin:#E9E2F3; --skin-line:#D3C7E3;
  --bone:#EFE7D4; --bone-ink:#B9AA86; --bone-line:#D9CBA6;
  --artery:#D04E66; --vein:#5470C8; --nerve:#D4A72C; --organ:#C9667E; --organ-ink:#8C5568;
  --o-brain:#EDBBCB; --o-gland:#CF8FB5; --o-air:#C9D3E9; --o-lung:#EEB8C3; --o-heart:#C9506A; --o-kidney:#B4606C;
  --o-liver:#A85A57; --o-gb:#7FA56C; --o-panc:#E6C38D; --o-stom:#E3A2AC; --o-spleen:#8E4B6B; --o-blad:#E9D37C; --o-gut:#DDA6A1;
  --shadow:0 1px 2px rgba(60,40,100,.06),0 4px 14px rgba(60,40,100,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:12px; --r-sm:8px;
  --top-h:60px; --rail-w:224px; --tap:44px; --pad:20px; --qpad:20px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#16121F; --surface:#1F1A2B; --surface2:#292236; --line:#3A3149; --line-soft:#2F283D;
  --fg:#ECE6F6; --muted:#A99FBC; --faint:#7D7393;
  --accent:#B69CF0; --accent-strong:#CDB8FA; --accent-soft:#33294A; --accent-ink:#1A1426; --lilac:#7F67B8;
  --ok:#6BC9A0; --ok-soft:#1E3A30; --warn:#E3B062; --warn-soft:#3B3020; --bad:#E78AA0; --bad-soft:#40222C;
  --skin:#2A2339; --skin-line:#3B3150; --bone:#D8CDB2; --bone-ink:#8F8264; --bone-line:#BFB293;
  --organ-ink:#E2A9B8; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#16121F; --surface:#1F1A2B; --surface2:#292236; --line:#3A3149; --line-soft:#2F283D;
  --fg:#ECE6F6; --muted:#A99FBC; --faint:#7D7393;
  --accent:#B69CF0; --accent-strong:#CDB8FA; --accent-soft:#33294A; --accent-ink:#1A1426; --lilac:#7F67B8;
  --ok:#6BC9A0; --ok-soft:#1E3A30; --warn:#E3B062; --warn-soft:#3B3020; --bad:#E78AA0; --bad-soft:#40222C;
  --skin:#2A2339; --skin-line:#3B3150; --bone:#D8CDB2; --bone-ink:#8F8264; --bone-line:#BFB293;
  --organ-ink:#E2A9B8; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--top-h) + 12px)}
@media (min-width:700px){html{font-size:17px}}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:.9375rem/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:650} h3{font-size:1.02rem;font-weight:650}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)} .small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* ── top bar ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px;stroke:var(--accent-strong);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand h1{font-size:1.08rem;font-weight:700}
.brand small{display:block;color:var(--muted);font-size:.74rem;line-height:1.2}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:700;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.target-pill{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted)}
.target-pill select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 6px;font-size:.84rem}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;padding:0;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--accent-strong);border-color:var(--lilac)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ── shell ──
   phone  (<700px):   bottom tab bar
   tablet (700–1099): slim icon rail (portrait + 1024 landscape)
   wide   (≥1100px):  full rail with live widgets */
.shell{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:calc(100dvh - var(--top-h))}
.rail{border-right:1px solid var(--line);background:var(--surface);padding:14px 10px 14px max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;
  position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top,0px));align-self:start;height:calc(100dvh - var(--top-h) - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain}
.rail .eyebrow{padding:4px 10px 8px}
.tab{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:700;font-size:.92rem;width:100%;position:relative}
.tab svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{background:var(--surface2);color:var(--fg)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong)}
.tab .badge{margin-left:auto;font-size:.7rem;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:1px 7px}
.rail-foot{margin-top:auto;padding:10px;font-size:.75rem;color:var(--faint);line-height:1.4}
.rail-cards{display:flex;flex-direction:column;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft)}
.rail-card{background:var(--surface2);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:12px}
.rail-card b{font-family:var(--f-display);font-size:1.2rem;line-height:1.1;display:block}
.rail-card span{font-size:.74rem;color:var(--muted);display:block}
.rail-card.two{justify-content:space-between;gap:8px}
.rail-card.two>div{flex:1;min-width:0}
.rail-card svg.mini{width:52px;height:52px;flex:none}
.mini circle{fill:none;stroke-width:7}
.mini .bgc{stroke:var(--line)} .mini .fgc{stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.mini .fgc.ok{stroke:var(--ok)}
.mini text{font:700 20px var(--f-display);fill:var(--fg)}
.rail-mini{display:none}
main{min-width:0;padding:20px max(var(--pad),env(safe-area-inset-right,0px)) 40px var(--pad)}
#view{container:main/inline-size}
.view{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.view-head p{color:var(--muted);max-width:62ch}

.bnav{display:none}
@media (min-width:700px) and (max-width:1099px){
  :root{--rail-w:96px}
  .rail{padding:12px 8px;gap:6px;align-items:stretch}
  .rail .eyebrow,.rail-foot,.rail-cards{display:none}
  .rail .tab{flex-direction:column;justify-content:center;gap:5px;padding:12px 4px;font-size:.7rem;text-align:center;min-height:70px;border-radius:14px;line-height:1.15}
  .rail .tab span:not(.badge){text-wrap:balance}
  .rail .tab svg{width:26px;height:26px}
  .rail .tab .badge{position:absolute;top:6px;right:8px;margin:0;font-size:.6rem;padding:0 6px}
  .rail-mini{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:auto;padding:12px 0 2px;border-top:1px solid var(--line-soft)}
  .rail-mini svg.mini{width:56px;height:56px}
  .rail-mini b{font-family:var(--f-display);font-size:.95rem;display:block;text-align:center;line-height:1.1}
  .rail-mini span{font-size:.62rem;color:var(--muted);display:block;text-align:center}
  .toast{bottom:88px}
}
@media (min-width:1100px){ .toast{bottom:24px} }
@media (max-width:699px){
  :root{--rail-w:0px;--pad:16px;--qpad:16px}
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  main{padding-block:16px calc(84px + env(safe-area-inset-bottom,0px));padding-left:max(var(--pad),env(safe-area-inset-left,0px))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
    padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav .tab{flex-direction:column;gap:2px;font-size:.7rem;padding:6px 2px;justify-content:center;align-items:center;text-align:center}
  .bnav .tab .badge{display:none}
  .target-pill span{display:none}
}

/* ── generic blocks ── */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
/* g2 / g3 are wrapping flex rows: the last card in a row grows to fill it, so no empty cells */
.g2,.g3{display:flex;flex-wrap:wrap}
.g2>*{flex:1 1 320px;min-width:0}
.g3>*{flex:1 1 270px;min-width:0}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@container main (max-width:859px){.g-main{grid-template-columns:minmax(0,1fr)}}
.panel>.row:last-child:not(.end){margin-top:auto}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--f-display);font-size:1.55rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:.78rem;color:var(--muted)}
@container main (max-width:899px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container main (max-width:479px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);
  border-radius:9px;padding:8px 13px;font-weight:700;font-size:.88rem;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--lilac);background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-strong)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:5px 9px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line-soft);white-space:nowrap}
.chip.accent{background:var(--accent-soft);color:var(--accent-strong);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

label.field{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:700;min-width:0}
.field input,.field select,.field textarea,.input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;font-size:.92rem;color:var(--fg);font-weight:400;min-width:0;width:100%}
.field textarea{resize:vertical;min-height:70px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);color:var(--accent-strong);border-radius:var(--r);padding:10px 14px;font-size:.9rem}
.banner p{flex:1;min-width:200px}
.empty{padding:26px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* bars */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 92px;gap:10px;align-items:center;font-size:.86rem}
.bar-row .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .lbl small{color:var(--faint);font-size:.74rem;margin-left:4px}
.track{height:10px;border-radius:99px;background:var(--surface2);position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}
.track i.ok{background:var(--ok)} .track i.warn{background:var(--warn)} .track i.bad{background:var(--bad)}
.track .mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg);opacity:.5;border-radius:2px}
.bar-row .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.82rem}
.bar-row .val b{color:var(--fg)}
.bar-row.btnlike{cursor:pointer;border-radius:6px} .bar-row.btnlike:hover .lbl{color:var(--accent-strong)}
.bars{container-type:inline-size}
@container (max-width:460px){
  .bar-row{grid-template-columns:minmax(0,1fr) auto;row-gap:5px}
  .bar-row .track{grid-column:1/-1;grid-row:2}
  .bar-row .lbl{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
}

.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-body)}
.chart .grid-l{stroke:var(--line-soft)}
.chart .passl{stroke:var(--warn);stroke-dasharray:5 4}
.chart .ln{stroke:var(--accent);fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .dot.end{fill:var(--accent);r:5}

.meter{height:14px;border-radius:99px;background:var(--surface2);position:relative}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--lilac),var(--accent))}
.meter .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--warn)}
.meter-legend{display:flex;justify-content:space-between;font-size:.74rem;color:var(--faint)}

/* exam cards */
.exam-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.exam-card .facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{background:var(--surface2);border-radius:8px;padding:7px 9px;display:flex;flex-direction:column;min-width:0}
.fact input{border:0;background:transparent;font-family:var(--f-display);font-weight:700;font-size:1.15rem;width:100%;padding:0;color:var(--fg);font-variant-numeric:tabular-nums}
.fact span{font-size:.72rem;color:var(--muted);font-weight:700}
.exam-card .note{font-size:.83rem;color:var(--muted)}
.exam-card .row{margin-top:auto}

/* quiz */
.qbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.qbar .title{font-family:var(--f-display);font-weight:700;margin-right:auto;min-width:0}
.timer{font-family:var(--f-mono);font-weight:700;font-size:.95rem;background:var(--surface2);border-radius:8px;padding:4px 10px}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.qprog{height:4px;background:var(--surface2);border-radius:4px;overflow:hidden}
.qprog i{display:block;height:100%;background:var(--accent)}
.navgrid{display:flex;flex-wrap:wrap;gap:5px}
.navgrid button{width:32px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:.76rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);position:relative}
.navgrid button.ans{background:var(--accent-soft);color:var(--accent-strong);border-color:transparent}
.navgrid button.okk{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.navgrid button.no{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.navgrid button.cur{outline:2px solid var(--accent);outline-offset:1px}
.navgrid button.flg::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.qstem{font-size:1.08rem;line-height:1.55;max-width:75ch}
.qhint{font-size:.8rem;font-weight:700;color:var(--accent-strong)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 13px;width:100%;line-height:1.45}
.opt:hover{border-color:var(--lilac)}
.opt .key{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--surface2);font-weight:700;font-size:.82rem;color:var(--muted)}
.opt.sata .key{border-radius:6px}

.opt.sel .key{background:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .key{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .key{background:var(--bad);color:var(--surface)}
.opt.missed{border-style:dashed;border-color:var(--ok)}

.calc{display:flex;gap:8px;align-items:center;max-width:280px}

.order li .n{width:24px;height:24px;border-radius:6px;background:var(--surface2);display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:none}
.order li .t{flex:1;min-width:0}

.rationale.ok{background:var(--ok-soft)} .rationale.bad{background:var(--bad-soft)}
.rationale b{font-family:var(--f-display)}
.hotwrap{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}

@container main (max-width:559px){.hotwrap{grid-template-columns:minmax(0,1fr)}.hotwrap svg.body{max-height:60dvh}}

/* body model */
svg.body{width:100%;height:auto;max-height:calc(100dvh - var(--top-h) - 130px);display:block;margin:0 auto;touch-action:manipulation}
.skin path,.skin ellipse,.skin rect{fill:var(--skin)}
.skin .limb path{fill:none;stroke:var(--skin);stroke-linecap:round}
.skin .limb ellipse{fill:var(--skin)}
.side-lbl{fill:var(--faint);font:700 10px var(--f-body);letter-spacing:.08em}
.bone{fill:var(--bone);stroke:var(--bone-ink);stroke-width:.8}
.bone.line,.bone .line,g.bone.line{fill:none;stroke:var(--bone-line);stroke-linecap:round}
.dash{stroke-dasharray:4 3}
.art{fill:none;stroke:var(--artery);stroke-linecap:round;stroke-linejoin:round}
.art.pulse{fill:var(--artery);stroke:none}
.vein{fill:none;stroke:var(--vein);stroke-linecap:round;stroke-linejoin:round}
.nrv{fill:none;stroke:var(--nerve);stroke-linecap:round;stroke-linejoin:round}
.org{stroke:var(--organ-ink);stroke-width:.8;opacity:.93}
.org-brain{fill:var(--o-brain)} .org-gland{fill:var(--o-gland)} .org-air{fill:var(--o-air)} .org-lung{fill:var(--o-lung)}
.org-heart{fill:var(--o-heart)} .org-kidney{fill:var(--o-kidney)} .org-liver{fill:var(--o-liver)} .org-gb{fill:var(--o-gb)}
.org-panc{fill:var(--o-panc)} .org-stom{fill:var(--o-stom)} .org-spleen{fill:var(--o-spleen)} .org-blad{fill:var(--o-blad)}
.org-line{fill:none;stroke:var(--organ-ink);stroke-linecap:round}
.org-tube{fill:none;stroke:var(--o-gut);stroke-linecap:round;stroke-linejoin:round}
.st{cursor:pointer;outline:none}
.st .hit .org,.st .hit .bone:not(.line){stroke-width:4px!important}
.st .hit,.st .hit *{fill:transparent!important;stroke:transparent!important;stroke-width:13px!important;stroke-dasharray:none!important;opacity:1}
.st:hover>:not(.hit),.st:focus-visible>:not(.hit){filter:drop-shadow(0 0 2.5px var(--accent))}
.st.sel>:not(.hit){filter:drop-shadow(0 0 3px var(--accent)) drop-shadow(0 0 1px var(--accent))}
.st.good>:not(.hit){filter:drop-shadow(0 0 3px var(--ok)) drop-shadow(0 0 1px var(--ok))}
.st.badp>:not(.hit){filter:drop-shadow(0 0 3px var(--bad)) drop-shadow(0 0 1px var(--bad))}
.st.dim{opacity:.35}
.body-layout{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;align-items:start}
.body-fig{position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top,0px) + 16px)}
@container main (max-width:559px){.body-layout{grid-template-columns:minmax(0,1fr)}.body-fig{position:static}.body-fig svg.body{max-height:62dvh}}
.layer-chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:.82rem;font-weight:700;display:inline-flex;gap:7px;align-items:center;color:var(--muted)}

/* tables */

td.r,th.r{text-align:right}
.ref-card table{font-size:.84rem}
.ref-card ul,.ev-list ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:.9rem}

/* evaluation */
.score-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.ring{width:118px;height:118px}
.ring circle{fill:none;stroke-width:10}

.ring .fgc.ok{stroke:var(--ok)} .ring .fgc.bad{stroke:var(--bad)}

.review-item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}

.mark-ok{color:var(--ok);font-weight:700} .mark-no{color:var(--bad);font-weight:700}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(30,20,50,.42);display:grid;place-items:center;padding:16px}
.modal-box{background:var(--surface);border-radius:14px;max-width:720px;width:100%;max-height:88dvh;overscroll-behavior:contain;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:.88rem;font-weight:700;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (prefers-reduced-motion: no-preference){

table.matrix tr.right td{background:var(--ok-soft)} table.matrix tr.wrong td{background:var(--bad-soft)}
/* reviewers */
.rev-layout{display:grid;grid-template-columns:clamp(190px,26cqw,260px) minmax(0,1fr);gap:16px;align-items:start}
.rev-nav{position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top,0px) + 16px);gap:2px;max-height:calc(100dvh - var(--top-h) - 32px);overflow-y:auto;overscroll-behavior:contain}

.rev-nav button.on{background:var(--accent-soft);color:var(--accent-strong);font-weight:700}

@container main (max-width:559px){.rev-layout{grid-template-columns:minmax(0,1fr)}.rev-nav{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}.rev-nav .eyebrow{width:100%}.rev-nav button{width:auto;background:var(--surface2)}}

/* ═════════ TABLET LAYER ═════════ */
.qbar{position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top,0px) + 6px);z-index:15;box-shadow:var(--shadow)}

  background:var(--surface);border-top:1px solid var(--line-soft);border-radius:0 0 var(--r) var(--r);display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}

}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:center;padding:clamp(18px,3cqw,32px);background:linear-gradient(135deg,var(--surface) 55%,var(--accent-soft))}

.hero{position:relative}

.mode-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@container main (max-width:559px){.mode-cards{grid-template-columns:minmax(0,1fr)}}
.mode-card{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;border-radius:var(--r);border:1.5px solid var(--line);padding:22px;min-height:170px;background:var(--surface);color:var(--fg)}
.mode-card svg{width:30px;height:30px;padding:8px;box-sizing:content-box;border-radius:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;background:var(--accent-soft);color:var(--accent-strong)}
.mc-t{font-family:var(--f-display);font-size:1.9rem;font-weight:700;line-height:1.1}
.mc-d{color:var(--muted);font-size:1rem;max-width:34ch}
.mc-go{margin-top:auto;font-weight:700;color:var(--accent-strong)}
.mode-card:hover{border-color:var(--lilac)}
.mode-card.exam{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mode-card.exam .mc-d,.mode-card.exam .mc-go{color:inherit;opacity:.92}
.mode-card.exam svg{background:color-mix(in srgb,var(--accent-ink) 20%,transparent);color:inherit}
.mode-card.exam:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
@media (prefers-reduced-motion:no-preference){.mode-card{transition:transform .15s ease}.mode-card:active{transform:scale(.985)}}

@media (orientation:portrait) and (min-width:560px){
  body.landing .view{gap:22px}
  body.landing .hero{grid-template-columns:minmax(0,1fr);text-align:center;padding:32px 28px 28px;gap:10px}
  body.landing .hero-art{order:-1;max-width:500px;margin:0 auto;width:100%}
  body.landing .hero-text{align-items:center}
  body.landing .hero-title{font-size:clamp(2.4rem,7vw,3.6rem)}
  body.landing .hero-note{max-width:none}
  body.landing .hero .chips{justify-content:center}
  body.landing .mode-card{min-height:210px;padding:26px}
}

.install{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;text-align:center}

<script>
/* RN Review Toolkit — exam profiles + starter question bank (PPC)
   Authoring convention: for MCQ the FIRST option is the correct one (options are shuffled at run time).
   S() = select-all-that-apply: correct options first, then wrong ones. */
const CATS = {
  mgmt: "Management of Care",
  safety: "Safety & Infection Control",
  health: "Health Promotion & Maintenance",
  psych: "Psychosocial Integrity",
  basic: "Basic Care & Comfort",
  pharm: "Pharmacological & Parenteral Therapies",
  risk: "Reduction of Risk Potential",
  physio: "Physiological Adaptation"
};
/* NCLEX-RN client-needs ranges (% of items) — 2026 plan (same ranges as 2023) */
const CAT_RANGE = { mgmt:[15,21], safety:[10,16], health:[6,12], psych:[6,12], basic:[6,12], pharm:[13,19], risk:[9,15], physio:[11,17] };
const TOPICS = {
  fund: "Fundamentals", medsurg: "Adult Med-Surg", pharm: "Pharmacology", mat: "Maternal–Newborn",
  peds: "Pediatrics", mh: "Mental Health", lead: "Leadership & Safety", anat: "Anatomy & Physiology"
};
/* SNLE (Saudi) blueprint groups: Adult 40 · Maternal-Child 30 · Fundamentals 20 · Management 10 */
const TOPIC_GROUPS = { medsurg:"Adult nursing", mh:"Adult nursing", mat:"Maternal-child", peds:"Maternal-child", fund:"Fundamentals", pharm:"Fundamentals", anat:"Fundamentals", lead:"Management & leadership" };

const EXAMS = [
  { id:"nclex", name:"NCLEX-RN", region:"USA", count:85, minutes:300, pass:65,
    note:"Computer-adaptive: 85–150 items (15 unscored pretest) in up to 5 h; pass/fail is decided by ability estimate, not a fixed %. This mock is fixed-length and the % is only your practice target. 2026 test plan: 1 Apr 2026 – 31 Mar 2029. Includes Next Gen item types." },
  { id:"dha", name:"DHA – Dubai (RN)", region:"UAE", count:150, minutes:180, pass:50,
    note:"Prometric CBT. Commonly reported as 150 single-best-answer MCQs, 3 h, pass mark 50%, pass/fail result only. Some sites still quote 100 questions / 60% — confirm in the current DHA candidate guideline." },
  { id:"doh", name:"DOH – Abu Dhabi (RN)", region:"UAE", count:150, minutes:180, pass:60,
    note:"DOH does not publish question count, time or pass mark for nurses and third-party figures conflict. These defaults are placeholders — edit them when you have the official handbook." },
  { id:"scfhs", name:"SCFHS SNLE – Saudi", region:"KSA", count:200, minutes:240, pass:60,
    note:"Per the SCFHS applicant guide: 200 single-best-answer MCQs in two parts of 100 (120 min each, 30-min break); up to 10% are unscored pilot items. Official pass = scaled score 500 on a 200–800 scale, so 60% here is a practice target. Blueprint: Adult 40%, Maternal-Child 30%, Fundamentals 20%, Management & Leadership 10%." },
  { id:"qchp", name:"DHP / QCHP – Qatar (RN)", region:"Qatar", count:150, minutes:180, pass:50,
    note:"Reported as Prometric CBT, 150 MCQs, 3 h, pass mark 50%. Verify with the regulator before booking." },
  { id:"kuwait", name:"Kuwait MOH (RN)", region:"Kuwait", count:150, minutes:170, pass:60,
    note:"Reported as Prometric CBT, 150 MCQs in 170 min, pass mark 60%, up to 3 attempts. Verify with MOH." },
  { id:"custom", name:"Custom drill", region:"Any", count:20, minutes:30, pass:70,
    note:"Your own length, time limit and target score." }
];

let _n = 0; const _id = () => "q" + String(++_n).padStart(3, "0");
const M = (cat, topic, q, opts, why) => ({ id:_id(), type:"mcq", cat, topic, q, opts, ans:0, why });
const S = (cat, topic, q, good, bad, why) => ({ id:_id(), type:"sata", cat, topic, q, opts:good.concat(bad), ans:good.map((_, i) => i), why });
const C = (cat, topic, q, ans, tol, unit, why) => ({ id:_id(), type:"calc", cat, topic, q, ans, tol, unit, why });
const O = (cat, topic, q, items, why) => ({ id:_id(), type:"order", cat, topic, q, items, why });
const H = (cat, topic, q, target, layers, why) => ({ id:_id(), type:"hot", cat, topic, q, target, layers, why });

const QUESTIONS = [
/* ───────── MANAGEMENT OF CARE ───────── */
M("mgmt","lead","Four clients are assigned to the nurse. Which client should the nurse assess first?",
 ["A client 2 hours after thyroidectomy with noisy respirations and a swelling neck","A client with COPD whose SpO₂ is 91% on 2 L/min oxygen","A client on postoperative day 1 reporting incisional pain rated 4/10","A client with type 2 diabetes whose fasting glucose is 9.4 mmol/L (170 mg/dL)"],
 "Noisy respirations and neck swelling after thyroidectomy suggest hematoma or airway compromise — airway comes first (ABCs). SpO₂ 91% is acceptable for COPD and the other clients are stable."),
M("mgmt","lead","Which task is most appropriate for the nurse to delegate to unlicensed assistive personnel (UAP)?",
 ["Measuring and recording vital signs for a stable client","Assessing pain 30 minutes after an IV opioid","Teaching a new client about insulin self-injection","Evaluating the appearance of a surgical wound"],
 "UAP may perform routine, predictable tasks for stable clients. Assessment, teaching, planning and evaluation remain with the RN."),
M("mgmt","lead","Just before signing a surgical consent form, a client says, “I don’t really understand what the surgeon told me.” What should the nurse do?",
 ["Hold the form and notify the surgeon so the procedure can be explained again","Explain the procedure in simple terms and then have the client sign","Ask a family member to sign on the client’s behalf","Have the client sign and document that understanding was verbalized"],
 "The provider is responsible for explaining the procedure, risks and alternatives. The nurse may witness a voluntary signature but must not proceed when the client does not understand."),
M("mgmt","lead","Which entry is most appropriate in the medical record after a client fall?",
 ["“Client found sitting on floor beside bed; states ‘I slipped going to the bathroom.’ No visible injury; provider notified at 14:10.”","“Incident report completed and filed with the nurse manager.”","“Client fell because the unit was short-staffed.”","“Fall caused by wet floor left by housekeeping.”"],
 "Chart objective facts: what was seen, what the client said, assessment findings and notifications. Do not mention the incident report or assign blame in the record."),
M("mgmt","lead","When reporting a change in a client’s condition using SBAR, which statement belongs in the “R” step?",
 ["“I recommend a chest X-ray and an ABG now; please come and assess the client.”","“The client became short of breath at 03:00.”","“He was admitted yesterday with pneumonia.”","“His SpO₂ is 86% and his respiratory rate is 32.”"],
 "S = Situation, B = Background, A = Assessment, R = Recommendation (what you need or want from the provider)."),
M("mgmt","lead","During a mass-casualty event using START triage, a client is breathing at 36 breaths/min after the airway is opened. How should the client be tagged?",
 ["Red — immediate","Yellow — delayed","Green — minor","Black — deceased/expectant"],
 "In START triage a respiratory rate above 30/min makes the client immediate (red). Not breathing after airway repositioning = black."),
M("mgmt","lead","A client who speaks very little English needs discharge teaching. Which approach is best?",
 ["Use a qualified medical interpreter and confirm understanding with teach-back","Ask the client’s 12-year-old child to interpret","Speak slowly and loudly and hand over written English instructions","Rely on the discharge paperwork only"],
 "Use a qualified interpreter (in person, phone or video). Family members — especially children — should not interpret. Confirm understanding with teach-back."),
M("mgmt","lead","A nurse suspects a client’s injuries are caused by domestic violence. What is the best way to interview the client?",
 ["Privately, without the partner present, in a non-judgmental manner","With the partner present so both sides can be heard","Through a family member who knows the client","Only after the client has been discharged"],
 "Screen privately and safely, document findings objectively, provide safety planning and local resources, and follow mandatory-reporting requirements where they apply."),

/* ───────── SAFETY & INFECTION CONTROL ───────── */
M("safety","fund","Which situation requires washing hands with soap and water rather than using an alcohol-based hand rub?",
 ["After caring for a client with Clostridioides difficile infection","Before entering the room of a client on contact precautions for MRSA","After removing gloves following routine care when hands are clean","Before accessing a central venous catheter when hands are visibly clean"],
 "Alcohol does not kill C. difficile spores, so wash with soap and water (also whenever hands are visibly soiled). Otherwise alcohol-based rub is preferred."),
M("safety","fund","Which client requires airborne precautions?",
 ["A client with suspected pulmonary tuberculosis","A client with influenza","A client with pertussis","A client with an MRSA-infected wound"],
 "Airborne (negative-pressure room, fit-tested N95 or higher): TB, measles, varicella, disseminated zoster. Influenza and pertussis are droplet; MRSA is contact."),
M("safety","fund","Which intervention is best for an older adult at high risk of falls?",
 ["Keep the bed in the lowest position with wheels locked and the call light within reach","Raise all four side rails","Apply a vest restraint at night","Keep the room dark overnight to promote sleep"],
 "Low bed, locked wheels, call light and personal items within reach, non-slip footwear and regular rounding reduce falls. Full rails and restraints increase injury and entrapment risk."),
M("safety","fund","The nurse discovers a small fire in a client’s room. According to RACE, what should the nurse do first?",
 ["Rescue clients who are in immediate danger","Activate the fire alarm","Close doors to contain the fire","Use the extinguisher with the PASS technique"],
 "RACE = Rescue, Alarm, Contain, Extinguish/Evacuate. Remove anyone in immediate danger first."),
M("safety","fund","Which pair of identifiers is acceptable before giving a medication?",
 ["Full name and date of birth (or medical record number)","Room number and diagnosis","First name and bed number","The name on the door and the nurse’s recognition of the client"],
 "Use two client-specific identifiers (name, DOB, record number, wristband barcode). Room or bed number is never an identifier."),
M("safety","medsurg","Before a client enters an MRI scanner, which question is the priority?",
 ["“Do you have a pacemaker, aneurysm clip or any other implanted metal device?”","“When did you last eat?”","“Do you have someone to drive you home?”","“Are you allergic to shellfish?”"],
 "The magnet can move or heat ferromagnetic objects and disrupt devices. Screening for implants, shrapnel and metal is the safety priority (shellfish allergy does not predict contrast reactions)."),
S("safety","fund","Which actions are part of standard precautions? Select all that apply.",
 ["Performing hand hygiene before and after client contact","Wearing gloves when touching blood or body fluids","Practicing respiratory hygiene and cough etiquette","Disposing of used sharps immediately in a puncture-resistant container"],
 ["Recapping used needles with two hands","Placing every client in a negative-pressure room"],
 "Standard precautions apply to all clients. Never recap used needles; negative-pressure rooms are reserved for airborne infections."),
S("safety","medsurg","Which findings suggest anaphylaxis? Select all that apply.",
 ["Stridor or wheezing","Hypotension with tachycardia","Generalized urticaria","Swelling of the lips and tongue"],
 ["Bradycardia with hypertension","Dry cough only"],
 "Anaphylaxis = airway swelling, bronchospasm, hypotension and rash. Stop the suspected agent, call for help, give IM epinephrine (adult 0.3–0.5 mg of 1 mg/mL, anterolateral thigh) per protocol, high-flow oxygen and IV fluids."),
O("safety","fund","Place the steps for putting on personal protective equipment (PPE) before entering an isolation room in order.",
 ["Perform hand hygiene","Put on the gown","Put on the mask or respirator","Put on eye protection (goggles or face shield)","Put on gloves over the gown cuffs"],
 "Donning: hand hygiene → gown → mask/respirator → eye protection → gloves. Doffing starts with the most contaminated items (gloves)."),
O("safety","fund","Order the key steps of adult basic life support for an unresponsive client.",
 ["Check the scene is safe and check responsiveness","Call for help / activate the emergency response and get an AED","Check breathing and carotid pulse for no more than 10 seconds","Start chest compressions (5–6 cm deep, 100–120/min)","Attach the AED and follow its prompts"],
 "Safe scene → responsiveness → activate response and AED → breathing and pulse check (≤ 10 s) → compressions → AED as soon as it is available."),

/* ───────── PHARMACOLOGICAL & PARENTERAL THERAPIES ───────── */
M("pharm","pharm","The nurse is about to give digoxin and finds an apical pulse of 54/min. What is the best action?",
 ["Hold the dose and notify the provider","Give the dose and recheck the pulse in 1 hour","Give half the dose","Give atropine"],
 "Hold digoxin for an adult apical pulse below 60/min (per policy) and report. Toxicity: bradycardia, nausea/vomiting, visual disturbances (yellow-green halos). Therapeutic level 0.5–2 ng/mL; low K⁺ increases toxicity."),
M("pharm","pharm","Which medication is the antidote for heparin overdose?",
 ["Protamine sulfate","Vitamin K (phytonadione)","Naloxone","Flumazenil"],
 "Heparin → protamine sulfate. Warfarin → vitamin K. Opioids → naloxone. Benzodiazepines → flumazenil."),
M("pharm","pharm","A client taking warfarin has an INR of 4.8 and no bleeding. What is the nurse’s best action?",
 ["Hold the next dose and notify the provider; anticipate possible vitamin K","Give the next dose as scheduled","Increase the dose to maintain therapy","Give protamine sulfate"],
 "The therapeutic INR for most indications is 2–3. A high INR requires holding or adjusting warfarin; low-dose vitamin K may be ordered. Monitor for bleeding."),
M("pharm","pharm","Which insulin may be given intravenously?",
 ["Regular insulin","NPH insulin","Insulin glargine","Premixed 75/25 insulin lispro"],
 "Only regular (short-acting) insulin is given IV, e.g., DKA infusions. NPH, mixed and basal insulins are subcutaneous only."),
M("pharm","pharm","A client receiving morphine has a respiratory rate of 8/min and is difficult to arouse. Which medication should the nurse anticipate?",
 ["Naloxone","Flumazenil","Protamine sulfate","Physostigmine"],
 "Opioid-induced respiratory depression: stop the opioid, stimulate and support ventilation, give naloxone per order and monitor — naloxone can wear off before the opioid does."),
M("pharm","pharm","A client who recently started lisinopril reports a persistent dry cough. What should the nurse do?",
 ["Report it to the provider; an ARB may be considered","Tell the client to take the drug with food","Tell the client to stop the drug immediately","Reassure the client that the cough will resolve within a week"],
 "ACE-inhibitor cough is common and persists while on the drug; the provider may switch to an ARB. Swelling of the lips or tongue (angioedema) is an emergency."),
M("pharm","pharm","A client taking metformin is scheduled for a CT scan with IV contrast. What should the nurse do?",
 ["Clarify with the provider whether to hold metformin per protocol and check renal function","Give the metformin as usual","Double the dose to protect the kidneys","Withhold all fluids before the scan"],
 "Contrast can injure the kidneys, raising the risk of metformin-associated lactic acidosis; protocols hold metformin around contrast depending on eGFR. Hydration is usually encouraged."),
M("pharm","mat","A client receiving a magnesium sulfate infusion for severe preeclampsia has absent patellar reflexes and a respiratory rate of 10/min. What is the priority action?",
 ["Stop the infusion and notify the provider; have calcium gluconate available","Slow the infusion and recheck in 1 hour","Encourage deep breathing and continue the infusion","Give naloxone"],
 "Magnesium toxicity: loss of deep tendon reflexes, respiratory rate below 12, urine output below 30 mL/h, hypotension. Antidote: calcium gluconate."),
M("pharm","pharm","A client taking furosemide should be monitored most closely for which laboratory finding?",
 ["Potassium 3.1 mmol/L","Sodium 140 mmol/L","Calcium 9.4 mg/dL","Chloride 102 mmol/L"],
 "Loop diuretics waste potassium (and magnesium). Hypokalemia (< 3.5 mmol/L) can cause weakness, cramps and arrhythmias."),
M("pharm","mh","A client taking an SSRI and tramadol has agitation, temperature 39.5 °C, diaphoresis and inducible clonus. What is the most likely cause?",
 ["Serotonin syndrome","Neuroleptic malignant syndrome","Anaphylaxis","Hypoglycemia"],
 "Serotonergic drugs plus hyperthermia, clonus, hyperreflexia and agitation point to serotonin syndrome (rapid onset). Stop the drugs and give supportive care. NMS is slower, with “lead-pipe” rigidity after dopamine antagonists."),
S("pharm","mh","Which findings indicate lithium toxicity? Select all that apply.",
 ["Coarse hand tremors","Persistent vomiting and diarrhea","Ataxia (unsteady gait)","Confusion"],
 ["Mild fine hand tremor","Dry mouth"],
 "Therapeutic lithium is 0.6–1.2 mEq/L; levels above 1.5 cause coarse tremor, GI symptoms, ataxia, confusion and seizures. Keep fluid and salt intake consistent."),
S("pharm","pharm","Which findings suggest digoxin toxicity? Select all that apply.",
 ["Nausea and anorexia","Yellow-green halos in vision","Bradycardia or new arrhythmias"],
 ["Increased urine output","Hypertension"],
 "Digoxin toxicity = GI upset, visual disturbances, bradycardia/arrhythmias. Hypokalemia, hypomagnesemia and renal impairment raise the risk."),
C("pharm","pharm","A child weighs 12 kg. The provider orders acetaminophen 15 mg/kg. The suspension contains 160 mg per 5 mL. How many mL should the nurse give? (round to the nearest tenth)",5.6,0.1,"mL","Dose = 15 × 12 = 180 mg. 180 ÷ 160 × 5 mL = 5.625 mL ≈ 5.6 mL."),
C("pharm","pharm","Order: digoxin 0.25 mg PO. Available: 0.125 mg tablets. How many tablets should the nurse give?",2,0,"tablets","0.25 ÷ 0.125 = 2 tablets."),
C("pharm","pharm","The provider orders 1,000 mL of 0.9% saline over 8 hours by infusion pump. What pump rate should the nurse set?",125,0,"mL/h","1,000 mL ÷ 8 h = 125 mL/h."),
C("pharm","pharm","Infuse 1,000 mL over 8 hours by gravity with a drop factor of 15 gtt/mL. How many drops per minute? (round to the nearest whole number)",31,1,"gtt/min","(1,000 × 15) ÷ (8 × 60) = 31.25 ≈ 31 gtt/min."),
C("pharm","pharm","Heparin is ordered at 18 units/kg/h for a client weighing 80 kg. The bag contains 25,000 units in 500 mL. At what rate should the pump be set? (round to the nearest tenth)",28.8,0.1,"mL/h","Dose = 18 × 80 = 1,440 units/h. Concentration = 25,000 ÷ 500 = 50 units/mL. 1,440 ÷ 50 = 28.8 mL/h."),

/* ───────── PHYSIOLOGICAL ADAPTATION ───────── */
M("physio","medsurg","Which finding is most consistent with diabetic ketoacidosis (DKA)?",
 ["Kussmaul respirations with fruity breath odor","Cool, clammy skin with tremors","Slow, shallow breathing with bradycardia","Hypotension with warm flushed skin and low glucose"],
 "DKA = hyperglycemia, ketosis and metabolic acidosis → deep rapid Kussmaul breathing, fruity breath, dehydration. Cool clammy skin with tremors indicates hypoglycemia."),
M("physio","medsurg","A conscious client with diabetes feels shaky and has a glucose of 2.8 mmol/L (50 mg/dL). What should the nurse do first?",
 ["Give 15 g of fast-acting carbohydrate, such as 120 mL of juice, and recheck in 15 minutes","Give peanut butter crackers only","Give 10 units of regular insulin","Give glucagon IM"],
 "Rule of 15: 15 g fast-acting carbohydrate, recheck in 15 minutes, repeat if still below 3.9 mmol/L (70 mg/dL), then give a snack. Glucagon or IV dextrose is for clients who are unconscious or cannot swallow."),
M("physio","medsurg","ABG results: pH 7.28, PaCO₂ 58 mmHg, HCO₃⁻ 26 mmol/L. What is the interpretation?",
 ["Uncompensated respiratory acidosis","Metabolic acidosis","Respiratory alkalosis","Metabolic alkalosis"],
 "Low pH with high PaCO₂ = respiratory acidosis; HCO₃⁻ is normal so there is no compensation yet. ROME: Respiratory Opposite, Metabolic Equal."),
M("physio","medsurg","ABG results: pH 7.30, PaCO₂ 38 mmHg, HCO₃⁻ 17 mmol/L. What is the interpretation?",
 ["Uncompensated metabolic acidosis","Respiratory acidosis","Metabolic alkalosis","Respiratory alkalosis"],
 "Low pH with low HCO₃⁻ and a normal PaCO₂ = metabolic acidosis (e.g., DKA, diarrhea, renal failure)."),
M("physio","medsurg","Which ECG change is associated with hyperkalemia?",
 ["Tall, peaked T waves","U waves","Flat T waves with ST depression","Saw-tooth flutter waves"],
 "Hyperkalemia: peaked T waves, widened QRS, loss of P waves. Hypokalemia: flat T waves and U waves. Treatment per order: IV calcium gluconate, insulin with dextrose, albuterol, potassium binders/diuretics, dialysis."),
M("physio","medsurg","A client reports chest pain radiating to the left arm with diaphoresis. Which action has the highest priority?",
 ["Obtain a 12-lead ECG within 10 minutes and notify the provider","Take a detailed past medical history first","Send the client for a chest X-ray","Give a light meal to prevent nausea"],
 "Suspected acute coronary syndrome: rapid 12-lead ECG, vital signs, IV access, continuous monitoring, oxygen if SpO₂ is low, aspirin (chewed) unless contraindicated, nitroglycerin per order."),
M("physio","medsurg","Which finding indicates left-sided heart failure?",
 ["Crackles in the lungs with orthopnea","Jugular vein distention with dependent edema","Hepatomegaly with ascites","Ankle swelling only"],
 "Left ventricular failure causes pulmonary congestion: dyspnea, crackles, orthopnea, cough, pink frothy sputum. Right-sided failure causes JVD, edema, hepatomegaly and ascites."),
M("physio","medsurg","Which information is most important to obtain from a client with suspected ischemic stroke?",
 ["The time symptoms started or the client was last known well","Dietary habits over the past month","Family history of diabetes","The client’s occupation"],
 "Thrombolysis eligibility depends on onset time (generally within 3–4.5 h of last known well; thrombectomy up to 24 h in selected clients). Time is brain — get an urgent CT."),
M("physio","medsurg","A client with a head injury has BP 180/70 mmHg, heart rate 48/min and irregular respirations. What do these findings suggest?",
 ["Late signs of increased intracranial pressure (Cushing’s triad)","Early hypovolemic shock","Septic shock","Anxiety"],
 "Cushing’s triad — hypertension with widened pulse pressure, bradycardia and irregular respirations — is a late, ominous sign of raised ICP. Notify immediately, head of bed 30°, head midline."),
M("physio","medsurg","Which oxygen saturation target is generally appropriate for a client with chronic COPD?",
 ["88–92%","97–100%","80–84%","100% at all times"],
 "In chronic CO₂ retainers, high-flow oxygen can blunt the hypoxic drive. Titrate low-flow oxygen (1–2 L/min or Venturi mask) to SpO₂ 88–92%."),
M("physio","medsurg","The nurse notes continuous bubbling in the water-seal chamber of a client’s chest drainage system. What does this indicate?",
 ["An air leak in the system or the lung","Normal lung re-expansion","Excess suction","Fluid overload"],
 "Intermittent bubbling in the suction-control chamber is expected; continuous bubbling in the water seal indicates an air leak — check connections and notify. Tidaling is normal."),
M("physio","medsurg","Which action should be avoided for a client with suspected appendicitis?",
 ["Applying a heating pad to the abdomen","Keeping the client NPO","Assessing pain and abdominal findings","Starting an IV line"],
 "Heat and laxatives can cause rupture. Keep NPO, give IV fluids and anticipate surgery. Sudden pain relief followed by fever and a rigid abdomen suggests perforation."),
M("physio","medsurg","A client with cirrhosis is prescribed lactulose. What is its purpose in hepatic encephalopathy?",
 ["It lowers ammonia by trapping it in the colon and promoting stool excretion","It prevents bleeding from varices","It reduces ascites","It increases appetite"],
 "Lactulose acidifies colonic contents (ammonia → ammonium) and acts as a laxative. Goal: 2–3 soft stools per day. Avoid sedatives and constipation."),
M("physio","mat","Four hours after delivery, a client has heavy vaginal bleeding and a boggy uterus above the umbilicus. What is the nurse’s first action?",
 ["Massage the fundus until firm","Reassess the fundus in 1 hour","Place the client in high Fowler’s position","Apply a perineal ice pack"],
 "Uterine atony is the most common cause of postpartum hemorrhage. Massage the fundus, empty the bladder (a full bladder displaces the uterus), give oxytocin per order and monitor vital signs."),
M("physio","peds","A 4-year-old has high fever, drooling, tripod positioning and a muffled voice. What should the nurse do?",
 ["Keep the child calm and upright, avoid examining the throat, and prepare for emergency airway management","Examine the throat with a tongue depressor","Lay the child flat for comfort","Obtain a throat culture"],
 "This suggests epiglottitis — a pediatric airway emergency. Do not use a tongue depressor, lay the child flat or upset the child; give oxygen and call anesthesia/ENT."),
M("physio","peds","Which finding is characteristic of pyloric stenosis in an infant?",

/* RN Review Toolkit — app logic (PPC). Depends on data-questions.js, data-anatomy.js, data-notes.js */
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmtTime = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
const fmtMin = s => s >= 3600 ? (s / 3600).toFixed(1) + " h" : Math.max(1, Math.round(s / 60)) + " min";
const dayKey = d => { const x = new Date(d); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };
const fmtDate = d => new Date(d).toLocaleDateString(undefined, { day:"numeric", month:"short", year:"numeric" });
const fmtDT = d => new Date(d).toLocaleString(undefined, { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });
const LETTERS = "ABCDEFGH";
const TYPE_NAMES = { mcq:"Multiple choice", sata:"Select all that apply", calc:"Calculation", order:"Ordered response", matrix:"Matrix (Next Gen)", hot:"Hotspot (body model)" };
const tone = p => p >= 75 ? "ok" : p >= 60 ? "warn" : "bad";

/* ───────── storage ───────── */
const KEY = "rn-review-toolkit.v1";
function blank() { return { attempts:[], studied:{}, read:{}, drill:{ tries:0, hits:0 }, custom:[], active:null,
  settings:{ goal:30, examDate:"", target:"nclex", overrides:{} }, ui:{ mode:"exam", tab:"progress", theme:"auto" } }; }
let DB, QMAP = {};
function allQ() { return QUESTIONS.concat(DB.custom || []); }
function reindex() { QMAP = {}; allQ().forEach(q => QMAP[q.id] = q); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} }
function load() {
  let raw = null; try { raw = localStorage.getItem(KEY); } catch (e) {}
  if (raw) { try { const d = JSON.parse(raw); DB = Object.assign(blank(), d); DB.settings = Object.assign(blank().settings, d.settings || {}); DB.ui = Object.assign(blank().ui, d.ui || {}); } catch (e) { DB = blank(); } }
  else { DB = blank(); reindex(); seedExamples(); }
  reindex();

function seedExamples() {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const skill = { mgmt:.74, safety:.8, health:.7, psych:.76, basic:.72, pharm:.52, risk:.63, physio:.6 };
  const plan = [ ["custom","Custom drill","tutor",12,11,0], ["nclex","NCLEX-RN","tutor",20,9,0], ["dha","DHA – Dubai (RN)","exam",30,7,1800],
                 ["custom","Custom drill","tutor",15,5,0], ["scfhs","SCFHS SNLE – Saudi","exam",30,3,2100], ["nclex","NCLEX-RN","exam",25,1,1800] ];
  const now = Date.now();
  plan.forEach(([exam, name, mode, n, daysAgo, limit], k) => {
    const qs = shuffle(QUESTIONS).slice(0, n); const lift = k * 0.025;
    const items = qs.map(q => { const ok = rnd() < Math.min(.95, (skill[q.cat] || .65) + lift); return { qid:q.id, v:null, ok, secs:Math.round(35 + rnd() * 70), flag:rnd() < .08 }; });
    const correct = items.filter(i => i.ok).length, p = pct(correct, n), pass = (EXAMS.find(e => e.id === exam) || {}).pass || 70;
    DB.attempts.push({ id:"ex" + k, sample:true, date:new Date(now - daysAgo * 864e5 - 3600e3 * (2 + k)).toISOString(), exam, examName:name, mode,
      n, correct, pct:p, pass, passed:p >= pass, secs:items.reduce((a, i) => a + i.secs, 0), limit, items, note:"Example attempt" });
  });
}

function itemsOf(atts) { const out = []; atts.forEach(a => a.items.forEach(i => { const q = QMAP[i.qid]; if (q) out.push(Object.assign({ q, date:a.date }, i)); })); return out; }
function group(items, keyFn, keys) {
  const m = {}; (keys || []).forEach(k => m[k] = { key:k, n:0, ok:0 });
  items.forEach(i => { const k = keyFn(i); if (!m[k]) m[k] = { key:k, n:0, ok:0 }; m[k].n++; if (i.ok) m[k].ok++; });
  return Object.values(m).map(g => Object.assign(g, { pct:pct(g.ok, g.n) }));
}
function qHistory() { /* per-question latest result */
  const h = {}; DB.attempts.slice().sort((a, b) => a.date < b.date ? -1 : 1).forEach(a => a.items.forEach(i => {
    const r = h[i.qid] || (h[i.qid] = { seen:0, right:0, last:null, flag:false }); r.seen++; if (i.ok) r.right++; r.last = i.ok; r.flag = i.flag; }));
  return h;
}
function streak() {
  const days = new Set(DB.attempts.map(a => dayKey(a.date))); let s = 0; const d = new Date();
  if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1);
  while (days.has(dayKey(d))) { s++; d.setDate(d.getDate() - 1); }
  return s;
}

function trendChart(atts, passLine) {
  if (atts.length < 2) return `<div class="empty small">Take at least two quizzes to see your score trend.</div>`;
  const W = 640, H = 210, L = 36, R = 16, T = 12, B = 30, iw = W - L - R, ih = H - T - B;
  const x = i => L + (atts.length === 1 ? iw / 2 : i * iw / (atts.length - 1)), y = v => T + ih * (1 - v / 100);
  let g = "";
  [0, 25, 50, 75, 100].forEach(v => g += `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`);
  const pts = atts.map((a, i) => [x(i), y(a.pct)]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const area = line + ` L${pts[pts.length - 1][0].toFixed(1)},${y(0)} L${pts[0][0].toFixed(1)},${y(0)} Z`;
  g += `<line class="passl" x1="${L}" x2="${W - R}" y1="${y(passLine)}" y2="${y(passLine)}"/><text x="${L + 6}" y="${y(passLine) - 6}">target ${passLine}%</text>`;
  g += `<path class="ar" d="${area}"/><path class="ln" d="${line}"/>`;
  pts.forEach((p, i) => g += `<circle class="dot ${i === pts.length - 1 ? "end" : ""}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i === pts.length - 1 ? 5 : 3.5}"><title>${esc(atts[i].examName)} · ${atts[i].pct}% · ${fmtDate(atts[i].date)}</title></circle>`);
  const last = pts[pts.length - 1];
  g += `<text x="${Math.min(last[0], W - R - 4)}" y="${last[1] - 11}" text-anchor="end" style="fill:var(--fg);font-weight:700">${atts[atts.length - 1].pct}%</text>`;
  g += `<text x="${L}" y="${H - 8}">${fmtDate(atts[0].date)}</text><text x="${W - R}" y="${H - 8}" text-anchor="end">${fmtDate(atts[atts.length - 1].date)}</text>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Score trend across ${atts.length} attempts">${g}</svg></div>`;
}

function builderPool(B) {
  const h = qHistory();
  return allQ().filter(q => (!B.cats.length || B.cats.includes(q.cat)) && (!B.topics.length || B.topics.includes(q.topic)) && (!B.types.length || B.types.includes(q.type))
    && (B.source === "all" || (B.source === "unseen" && !h[q.id]) || (B.source === "missed" && h[q.id] && h[q.id].last === false) || (B.source === "flagged" && h[q.id] && h[q.id].flag)));
}

/* weighted selection following each exam's blueprint */
function pickWeighted(pool, n, weights, keyFn) {
  const groups = {}; shuffle(pool).forEach(q => (groups[keyFn(q)] = groups[keyFn(q)] || []).push(q));
  const sum = Object.values(weights).reduce((a, b) => a + b, 0); const out = [];
  Object.entries(weights).forEach(([k, w]) => { const take = Math.round(n * w / sum); out.push(...(groups[k] || []).splice(0, take)); });
  const rest = shuffle(Object.values(groups).flat()); while (out.length < n && rest.length) out.push(rest.pop());
  return shuffle(out.slice(0, n));
}
function buildExamSet(p, n) {
  const pool = allQ();
  if (p.id === "nclex") { const w = {}; Object.entries(CAT_RANGE).forEach(([k, r]) => w[k] = (r[0] + r[1]) / 2); return pickWeighted(pool, n, w, q => q.cat); }
  if (p.id === "scfhs") return pickWeighted(pool.filter(q => q.type !== "hot"), n, { "Adult nursing":40, "Maternal-child":30, "Fundamentals":20, "Management & leadership":10 }, q => TOPIC_GROUPS[q.topic] || "Fundamentals");
  const gulf = ["dha","doh","qchp","kuwait"].includes(p.id);
  return shuffle(gulf ? pool.filter(q => q.type === "mcq" || q.type === "calc") : pool).slice(0, n);
}
function startSession({ exam, label, mode, qs, limitSec, pass }) {
  if (!qs.length) { toast("No questions match. Widen the filters."); return; }
  const s = { id:"a" + Date.now().toString(36), exam, label, mode, pass, limit:limitSec || 0, qids:qs.map(q => q.id), cur:0, resp:{}, optOrder:{}, ordInit:{},
    elapsedBase:0, runStart:Date.now(), qStart:Date.now(), started:new Date().toISOString() };
  qs.forEach(q => {
    if (q.type === "mcq" || q.type === "sata") s.optOrder[q.id] = shuffle(q.opts.map((_, i) => i));
    if (q.type === "order") { let o; do { o = shuffle(q.items.map((_, i) => i)); } while (q.items.length > 1 && o.every((v, i) => v === i)); s.ordInit[q.id] = o; }
  });
  DB.active = s; UI.result = null; UI.confirm = null; save(); go("exam", "quiz");
}

/* ═════════ QUIZ ═════════ */
function elapsed(s) { return s.elapsedBase + (Date.now() - s.runStart) / 1000; }
function commitQTime() { const s = DB.active; if (!s) return; const qid = s.qids[s.cur]; const r = s.resp[qid] || (s.resp[qid] = {}); r.secs = (r.secs || 0) + (Date.now() - s.qStart) / 1000; s.qStart = Date.now(); s.elapsedBase = elapsed(s); s.runStart = Date.now(); }
let ticker = null;
function startTicker() { stopTicker(); ticker = setInterval(() => {
  const s = DB.active; if (!s) return stopTicker(); const el = $("#timer"); const e = elapsed(s);
  if (s.limit) { const left = s.limit - e; if (el) { el.textContent = fmtTime(left); el.classList.toggle("low", left < 300); } if (left <= 0) { toast("Time is up — exam submitted."); finishSession(true); } }
  else if (el) el.textContent = fmtTime(e);
}, 1000); }
function stopTicker() { if (ticker) clearInterval(ticker); ticker = null; }

function grade(q, v) {
  if (v == null || v === "") return false;
  if (q.type === "mcq") return v === q.ans;
  if (q.type === "sata") return Array.isArray(v) && v.length === q.ans.length && q.ans.every(a => v.includes(a));
  if (q.type === "calc") { const x = parseFloat(String(v).replace(",", ".")); return !isNaN(x) && Math.abs(x - q.ans) <= (q.tol || 0) + 1e-9; }
  if (q.type === "order") return Array.isArray(v) && v.every((x, i) => x === i);
  if (q.type === "hot") return v === q.target;
  if (q.type === "matrix") return Array.isArray(v) && q.rows.every((row, i) => v[i] === row[1]);
  return false;
}

  }

  if (q.type === "order") {

      ${lock ? "" : `<span class="mv"><button data-act="mv" data-k="${k}" data-d="-1" ${k ? "" : "disabled"} aria-label="Move up">↑</button><button data-act="mv" data-k="${k}" data-d="1" ${k < ord.length - 1 ? "" : "disabled"} aria-label="Move down">↓</button></span>`}</li>`).join("")}</ol>`;

const SNAME = id => (STRUCTURES.find(s => s.id === id) || { name:id }).name;

function setResp(fn) { const s = DB.active, qid = s.qids[s.cur]; const r = s.resp[qid] || (s.resp[qid] = {}); if (s.mode === "tutor" && r.submitted) return; fn(r, QMAP[qid], s); save(); }

/* ═════════ EVALUATION ═════════ */

  const cats = group(items, i => i.q.cat).sort((x, y) => x.pct - y.pct);

  <div class="grid g-main">
    <div class="panel"><div class="score-hero">${ring(a.pct, a.passed ? "ok" : "bad")}
      <div style="display:flex;flex-direction:column;gap:10px;min-width:0">
        <div class="row"><span class="chip ${a.passed ? "ok" : "bad"}">${a.passed ? "Met target" : "Below target"} (${a.pass}%)</span>${delta != null ? `<span class="chip ${delta >= 0 ? "ok" : "bad"}">${delta >= 0 ? "+" : ""}${delta} pts vs last ${esc(a.examName)}</span>` : ""}</div>
        <div class="statline"><div><b class="num">${a.correct}/${a.n}</b><span>Correct</span></div><div><b class="num">${fmtMin(a.secs)}</b><span>Time used${a.limit ? " of " + fmtMin(a.limit) : ""}</span></div>
          <div><b class="num">${Math.round(avg)} s</b><span>Avg per question</span></div><div><b class="num">${flagged}</b><span>Flagged</span></div></div>
        ${a.exam === "nclex" ? `<p class="small muted">The real NCLEX-RN is pass/fail by computer-adaptive ability estimate; this percentage is for tracking only.</p>` : ""}
      </div></div></div>
    <div class="panel ev-list"><h3>What to do next</h3><ul>${recs.join("")}</ul>
      <label class="field">Notes for this attempt<textarea id="note-${a.id}" data-note="${a.id}" placeholder="e.g. rushed the SATA items, review insulin types">${esc(a.note || "")}</textarea></label></div>
  </div>
  <div class="grid g2">
    <div class="panel"><h3>By client need</h3><div class="bars">${cats.map(g => barRow(CATS[g.key] || g.key, g)).join("")}</div></div>
    <div class="panel"><h3>By subject area</h3><div class="bars">${topics.map(g => barRow(TOPICS[g.key] || g.key, g)).join("")}</div></div>

    ${a.sample ? `<p class="small muted">Example attempts do not store individual answers.</p>` : ""}
    <div class="review-grid">${list.map(i => `<div class="review-item">
      <div class="row" style="flex-wrap:nowrap;align-items:flex-start"><span class="${i.ok ? "mark-ok" : "mark-no"}">${i.ok ? "✓" : "✗"}</span><div class="stem" style="flex:1;min-width:0">${esc(i.q.q)}</div><span class="chip num">${i.secs}s</span></div>

function csvCell(v) { v = String(v ?? ""); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }

function importData(text) {
  let d; try { d = JSON.parse(text); } catch (e) { toast("That file isn’t valid JSON. Check it and try again."); return; }
  if (d && Array.isArray(d.attempts)) {
    const have = new Set(DB.attempts.map(a => a.id)); let n = 0;
    (d.custom || []).forEach(q => { if (!QMAP[q.id]) { DB.custom.push(q); } }); reindex();
    d.attempts.forEach(a => { if (!have.has(a.id)) { DB.attempts.push(a); n++; } });
    Object.assign(DB.studied, d.studied || {});
    save(); closeModal(); render(); toast(`Merged ${n} attempt${n === 1 ? "" : "s"} from backup.`); return;
  }
  const arr = Array.isArray(d) ? d : (d && d.questions);
  if (!Array.isArray(arr)) { toast("No attempts or questions found in that JSON."); return; }
  let added = 0, bad = 0;
  arr.forEach(q => {
    const ok = q && q.q && q.why !== undefined && ((q.type === "mcq" && Array.isArray(q.opts) && Number.isInteger(q.ans)) || (q.type === "sata" && Array.isArray(q.opts) && Array.isArray(q.ans))
      || (q.type === "calc" && typeof q.ans === "number") || (q.type === "order" && Array.isArray(q.items)));
    if (!ok) { bad++; return; }
    DB.custom.push(Object.assign({ cat:"physio", topic:"fund", why:"" }, q, { id:"c" + Date.now().toString(36) + (added++) }));
  });

}

/* ═════════ BODY MODELS ═════════ */

  STRUCTURES.forEach(st => {
    if (!st.layers.some(l => layers.includes(l))) return;
    const inner = st.bi ? `<g>${st.svg}</g><g transform="matrix(-1 0 0 1 300 0)">${st.svg}</g>` : st.svg;
    s += `<g class="st ${mark[st.id] || ""}" data-act="${act}" data-st="${st.id}" tabindex="0" role="button" aria-label="${esc(act === "bodyPick" ? st.name : "Structure")}"><g>${inner}</g><g class="hit">${inner}</g></g>`;

}
