/* ═════════ actions ═════════ */
function quickStart(kind) {
  const all = allQ();
  if (kind === "mix") return startSession({ exam:"custom", label:"Quick 10", mode:"tutor", qs:shuffle(all).slice(0, 10), pass:profile("custom").pass });
  if (kind === "hot") return startSession({ exam:"custom", label:"Body-model hotspots", mode:"tutor", qs:shuffle(all.filter(q => q.type === "hot")).slice(0, 12), pass:profile("custom").pass });
  const cats = group(itemsOf(DB.attempts), i => i.q.cat, Object.keys(CATS)).filter(g => g.n >= 3).sort((a, b) => a.pct - b.pct).slice(0, 2).map(g => g.key);
  const use = cats.length ? cats : ["pharm", "physio"];
  startSession({ exam:"custom", label:"Weak areas: " + use.map(c => CATS[c]).join(" + "), mode:"tutor", qs:shuffle(all.filter(q => use.includes(q.cat))).slice(0, 15), pass:profile("custom").pass });
}
function drill(cat, topic) {
  const qs = shuffle(allQ().filter(q => (!cat || q.cat === cat) && (!topic || q.topic === topic))).slice(0, 15);
  startSession({ exam:"custom", label:"Drill: " + (cat ? CATS[cat] : TOPICS[topic]), mode:"tutor", qs, pass:profile("custom").pass });
}
const ACT = {
  mode: t => { go(t.dataset.mode, MODES[t.dataset.mode].tabs[0][0]); },
  tab: t => { const tab = t.dataset.tab; const mode = Object.keys(MODES).find(m => MODES[m].tabs.some(x => x[0] === tab)); if (tab === "log") UI.logView = null; go(mode, tab); },
  clearSamples: () => { DB.attempts = DB.attempts.filter(a => !a.sample); UI.result = null; save(); render(); toast("Example attempts cleared."); },
  quick: t => quickStart(t.dataset.kind),
  drill: t => drill(t.dataset.cat, t.dataset.topic),
  gotoBody: () => go("study", "body"),
  install: () => { if (!installEvt) return; installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; if (UI.landing) render(); }); },
  home: () => { UI.landing = true; render(); window.scrollTo({ top:0 }); },
  theme: () => { const o = ["auto", "light", "dark"]; DB.ui.theme = o[(o.indexOf(DB.ui.theme || "auto") + 1) % 3]; save(); applyTheme(); toast("Theme: " + DB.ui.theme); },
  focus: () => { UI.focus = !UI.focus; render(); },
  viewAttempt: t => { UI.logView = t.dataset.id; UI.evalFilter = "all"; go("exam", "log"); },
  startExam: t => { const p = profile(t.dataset.exam); const bank = allQ().length; const n = Math.min(p.count, bank);
    const qs = buildExamSet(p, n); const limit = t.dataset.mode === "exam" ? Math.round(p.minutes * 60 * qs.length / p.count) : 0;
    startSession({ exam:p.id, label:p.name, mode:t.dataset.mode, qs, limitSec:limit, pass:p.pass }); },
  bchip: t => { const B = UI.builder, k = t.dataset.key, v = t.dataset.v; B[k] = B[k].includes(v) ? B[k].filter(x => x !== v) : B[k].concat(v); render(); },
  bReset: () => { UI.builder = defaultBuilder(); render(); },
  bStart: () => { const B = UI.builder; const qs = shuffle(builderPool(B)).slice(0, Math.max(1, +B.count || 20));
    startSession({ exam:"custom", label:"Custom drill", mode:B.mode, qs, limitSec:(+B.minutes || 0) * 60, pass:profile("custom").pass }); },
  pick: t => { const i = +t.dataset.i; setResp((r, q) => { if (q.type === "mcq") r.v = i; else { const v = r.v || []; r.v = v.includes(i) ? v.filter(x => x !== i) : v.concat(i); } }); render(); },
  mv: t => { const k = +t.dataset.k, d = +t.dataset.d; setResp((r, q, s) => { const o = (r.v || s.ordInit[q.id]).slice(); [o[k], o[k + d]] = [o[k + d], o[k]]; r.v = o; }); render(); },
  mx: t => { const i = +t.dataset.r, j = +t.dataset.c; setResp((r, q) => { const m = (r.m || []).slice(); m[i] = j; r.m = m; r.v = q.rows.every((_, k) => m[k] != null) ? m.slice() : null; }); render(); },
  hotpick: t => { setResp(r => { r.v = t.dataset.st; }); render(); },
  submitQ: () => { const s = DB.active, qid = s.qids[s.cur], r = s.resp[qid] || (s.resp[qid] = {}); const q = QMAP[qid];
    if (q.type === "order" && !r.v) r.v = s.ordInit[qid].slice();
    if (!answered(r)) return; commitQTime(); r.submitted = true; r.ok = grade(q, r.v); save(); render(); },
  next: () => { const s = DB.active; const q = QMAP[s.qids[s.cur]]; const r = s.resp[q.id];
    if (s.mode === "exam" && q.type === "order" && !r) s.resp[q.id] = { v:null }; commitQTime(); s.cur = Math.min(s.qids.length - 1, s.cur + 1); save(); render(); window.scrollTo({ top:0 }); },
  prev: () => { const s = DB.active; commitQTime(); s.cur = Math.max(0, s.cur - 1); save(); render(); },
  jump: t => { const s = DB.active; commitQTime(); s.cur = +t.dataset.i; save(); render(); },
  flag: () => { const s = DB.active, qid = s.qids[s.cur]; const r = s.resp[qid] || (s.resp[qid] = {}); r.flag = !r.flag; save(); render(); },
  finish: () => finishSession(false),
  finishNow: () => finishSession(true),
  abandon: () => { UI.confirm = "abandon"; render(); },
  abandonNow: () => { DB.active = null; UI.confirm = null; stopTicker(); save(); render(); toast("Quiz discarded."); },
  cancelConfirm: () => { UI.confirm = null; render(); },
  evf: t => { UI.evalFilter = t.dataset.f; render(); },
  goLog: () => { UI.logView = UI.result; go("exam", "log"); },
  logBack: () => { UI.logView = null; render(); },
  openAttempt: (t, e) => { if (e.target.closest("button")) return; UI.logView = t.dataset.id; UI.evalFilter = "all"; render(); window.scrollTo({ top:0 }); },
  retryWrong: t => { const a = DB.attempts.find(x => x.id === t.dataset.id); const qs = a.items.filter(i => !i.ok).map(i => QMAP[i.qid]).filter(Boolean);
    startSession({ exam:a.exam, label:"Retry missed: " + a.examName, mode:"tutor", qs:shuffle(qs), pass:a.pass }); },
  del: t => { UI.confirm = "del:" + t.dataset.id; render(); },
  delNow: t => { DB.attempts = DB.attempts.filter(a => a.id !== t.dataset.id); UI.confirm = null; save(); render(); toast("Attempt deleted."); },
  exportCSV, exportJSON, importOpen,
  closeModal,
  copyExport: () => { const ta = $("#exportText"); const done = () => toast("Copied to clipboard.");
    try { navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); toast("Text selected — press Ctrl/Cmd+C to copy."); }); } catch (e) { ta.select(); toast("Text selected — press Ctrl/Cmd+C to copy."); } },
  download: t => { try { const blob = new Blob([$("#exportText").value], { type:t.dataset.m }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = t.dataset.f; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { toast("Download isn’t available here. Use Copy instead."); } },
  importPaste: () => { const v = $("#importText").value.trim(); if (!v) { toast("Paste some JSON first."); return; } importData(v); },
  layer: t => { const l = t.dataset.l; const L = UI.bodyLayers; UI.bodyLayers = L.includes(l) ? (L.length > 1 ? L.filter(x => x !== l) : L) : L.concat(l); UI.find = null; UI.findMsg = null; render(); },
  bodyMode: t => { UI.bodyMode = t.dataset.m; UI.find = null; UI.findMsg = null; render(); },
  bodyPick: t => { UI.bodySel = t.dataset.st; DB.studied[t.dataset.st] = 1; save(); render(); },
  findNext: () => { const pool = STRUCTURES.filter(s => s.layers.some(l => UI.bodyLayers.includes(l)) && s.id !== UI.find); UI.find = pool[Math.floor(Math.random() * pool.length)].id; UI.findMsg = null; render(); },
  findPick: t => { if (!UI.find || UI.findMsg) return; const ok = t.dataset.st === UI.find; DB.drill.tries++; if (ok) DB.drill.hits++; DB.studied[UI.find] = 1; UI.findMsg = { ok, picked:t.dataset.st, target:UI.find }; save(); render(); },
  findSkip: () => { if (!UI.find) return; DB.drill.tries++; UI.findMsg = { ok:false, picked:null, target:UI.find }; save(); render(); },
  revPick: t => { UI.revSel = t.dataset.id; render(); window.scrollTo({ top:0 }); },
  revDone: t => { const id = t.dataset.id; if (DB.read[id]) delete DB.read[id]; else DB.read[id] = 1; save(); render(); },
  refTag: t => { UI.refTag = t.dataset.t; render(); },
  bankPractice: () => startSession({ exam:"custom", label:"Bank practice", mode:"tutor", qs:shuffle(bankList()).slice(0, 40), pass:profile("custom").pass })
};
/* input handlers (keep focus while typing) */
const INPUT = {
  bodySearch: v => { UI.bodySearch = v; },
  refQ: v => { UI.refQ = v; },
  bankQ: v => { UI.bank.q = v; }
};
function rerenderKeepFocus(id) { const el = document.getElementById(id); const pos = el ? el.selectionStart : null; render(); const n = document.getElementById(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  if (t.tagName === "SELECT" || t.tagName === "INPUT" || t.tagName === "TEXTAREA") return;
  const f = ACT[t.dataset.act]; if (f) f(t, e);
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches(".brand")) { ACT.home(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("g.st[data-act]")) { e.preventDefault(); const f = ACT[e.target.dataset.act]; if (f) f(e.target, e); }
  if (e.key === "Escape" && !$("#modal").hidden) closeModal();
});
/* quiz keyboard shortcuts (tablet + keyboard case): 1-9 / A-H choose · Enter check/next · ← → previous/next */
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || !DB.active || UI.landing || DB.ui.tab !== "quiz" || !$("#modal").hidden) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const k = e.key;
  if (/^[1-9a-hA-H]$/.test(k)) { const idx = /\d/.test(k) ? +k - 1 : LETTERS.indexOf(k.toUpperCase()); const o = document.querySelectorAll(".opts .opt")[idx]; if (o && !o.disabled) { e.preventDefault(); o.click(); } }
  else if (k === "Enter" && !e.target.closest("button,a")) { const b = $(".qfoot .btn.primary:not(:disabled)"); if (b) { e.preventDefault(); b.click(); } }
  else if (k === "ArrowRight" || k === "ArrowLeft") { const b = $(k === "ArrowRight" ? '.qfoot [data-act="next"]' : '.qfoot [data-act="prev"]'); if (b && !b.disabled) { e.preventDefault(); b.click(); } }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.actInput) { INPUT[t.dataset.actInput](t.value); rerenderKeepFocus(t.id); return; }
  if (t.id === "calcIn") { setResp(r => { r.v = t.value.trim(); }); const btn = $('[data-act="submitQ"]'); if (btn) btn.disabled = !t.value.trim(); return; }
  if (t.dataset.note) { const a = DB.attempts.find(x => x.id === t.dataset.note); if (a) { a.note = t.value; save(); } return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "targetSel") { DB.settings.target = t.value; save(); render(); return; }
  if (t.dataset.set) { DB.settings[t.dataset.set] = t.type === "number" ? Math.max(1, +t.value || 30) : t.value; save(); render(); return; }
  if (t.dataset.ov) { const o = DB.settings.overrides[t.dataset.ov] || (DB.settings.overrides[t.dataset.ov] = {}); const v = +t.value; if (v > 0) o[t.dataset.k] = v; save(); render(); return; }
  if (t.dataset.b) { UI.builder[t.dataset.b] = t.type === "number" ? +t.value : t.value; render(); return; }
  if (t.dataset.bank) { UI.bank[t.dataset.bank] = t.value; render(); return; }
  if (t.dataset.actChange === "logFilter") { UI.logFilter = t.value; render(); return; }
  if (t.id === "importFile" && t.files[0]) { const fr = new FileReader(); fr.onload = () => importData(fr.result); fr.readAsText(t.files[0]); }
});
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("visibilitychange", () => { const s = DB.active; if (!s) return; if (document.hidden) { s.elapsedBase = elapsed(s); s.runStart = Date.now(); save(); } });

window.addEventListener("resize", measureTop);
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (UI.landing && DB) render(); });
window.addEventListener("appinstalled", () => { installEvt = null; if (UI.landing) render(); });
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { if ((DB.ui.theme || "auto") === "auto") applyTheme(); });
load(); { const q = new URLSearchParams(location.search).get("mode"); if (MODES[q]) { UI.landing = false; DB.ui.mode = q; DB.ui.tab = MODES[q].tabs[0][0]; } }
if (DB.active) { DB.active.runStart = Date.now(); DB.active.qStart = Date.now(); }
render();

</script>
